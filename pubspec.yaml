name: riffshelf
description: A Flutter starter app for RiffShelf.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.2
  dart_gp_tab_reader: ^0.4.0
  file_picker: ^13.1.0
  crypto: ^3.0.6
  http: ^1.5.0
  record: ^7.1.2
  shared_preferences: ^2.5.6
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
